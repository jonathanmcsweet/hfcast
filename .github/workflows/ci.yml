name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The engine commit the server is tested against. The server talks to
# the engine over a JSON contract through a subprocess, and nothing else
# checks that the two agree — so this pin is the written answer to
# "which engine version does this server work with?". Move it
# deliberately, with the tests as the evidence.
env:
  ENGINE_REPO: jonathanmcsweet/hfcast-engine
  ENGINE_COMMIT: 8555897f715028b798119ef156ac8c7badcf5077

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      # Everything below exists so the four engine tests run rather than
      # skip. They are the only check that the server and the engine
      # agree on the JSON the one sends and the other parses.
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Build voacapl and its data tree
        run: |
          git clone --quiet https://github.com/jawatson/voacapl.git /tmp/voacapl
          cd /tmp/voacapl
          ./configure --prefix="$HOME/.local"
          make -j4
          make install
          # The installed copy: the prefix is substituted into it by the
          # install hook, and the source copy still says __PREFIX__.
          "$HOME/.local/bin/makeitshfbc"

      - name: Cache the engine build
        uses: actions/cache@v4
        with:
          path: /tmp/hfcast-engine/target
          key: engine-${{ runner.os }}-${{ env.ENGINE_COMMIT }}

      - name: Build the engine at the pinned commit
        run: |
          git clone --quiet "https://github.com/$ENGINE_REPO.git" /tmp/hfcast-engine
          git -C /tmp/hfcast-engine checkout --quiet "$ENGINE_COMMIT"
          cargo build --release --manifest-path /tmp/hfcast-engine/Cargo.toml --bin predict

      - name: Test
        env:
          HFCAST_PREDICT: /tmp/hfcast-engine/target/release/predict
        run: |
          pnpm test 2>&1 | tee test.log
          # A skipped engine test means the wiring above silently failed,
          # which would leave the contract unchecked while CI stayed
          # green. Assert zero skips rather than look for a nonzero count,
          # so a change to the reporter's output fails loudly instead of
          # passing quietly.
          if ! grep -qE 'skipped 0$' test.log; then
            echo "::error::tests were skipped, or the summary could not be read"
            exit 1
          fi

  # Nothing in the `check` job installs or builds the app, so for a while
  # nothing checked it at all. A flat-layout setting went dead when pnpm 11
  # stopped reading .npmrc, the next install relinked the tree, and the web
  # build stayed broken until somebody ran it by hand.
  #
  # The install and the export together are what catch that class of fault:
  # the install decides the module layout, and the export is the only step
  # that makes Metro resolve every import and @expo/cli load its own
  # dependencies. A type error alone would not have caught it.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hfcast
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # The app is a separate project with its own lockfile. Without
          # this the cache keys off the repository root's lockfile, which
          # lists two formatters and none of the app's dependencies.
          cache-dependency-path: hfcast/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build for web
        run: pnpm exec expo export --platform web

      - name: Check the export produced something
        run: |
          # `expo export` has been known to exit 0 after writing nothing.
          # Assert the two artefacts a served build cannot work without,
          # rather than trusting the exit status alone.
          test -f dist/index.html
          bundle=$(find dist/_expo -name '*.js' -size +100k | head -1)
          if [ -z "$bundle" ]; then
            echo "::error::no JavaScript bundle over 100 kB in dist/_expo"
            exit 1
          fi
          echo "bundled $bundle"
