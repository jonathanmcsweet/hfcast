name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The server talks to the engine over a JSON contract, through a
# subprocess, and nothing else checks that the two agree. So this builds
# the engine and runs those four tests for real.
#
# The engine comes from crates.io, at the version in the application's
# `Cargo.lock`. That is the version the application is built against, so
# it is the one the server has to agree with, and there is no second
# place to keep in step. The published crate carries the `predict`
# binary and nothing else of its 22.
#
# It carries no ionospheric coefficients either — see the engine's
# NOTICE — so `predict` reads them from the `itshfbc` tree this job
# builds below, which is how the reference engine has always found them.
# An Android build is the case that needs them compiled in, and that one
# still needs an engine checkout: see `arch.yml`.

jobs:
  # A change that does not move the version of the part it changed fails
  # here. The three parts move independently, so a change under `server/`
  # needs the server version and nothing else. Pull requests only: it
  # compares against the base branch, and a push to `main` has no base
  # branch to compare against.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base has to be reachable, so the whole history.
          fetch-depth: 0

      - name: The changed parts must move their versions
        run: tools/check-version-bump.sh "origin/${{ github.base_ref }}"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Read the engine version the application depends on
        id: engine
        run: bash .github/read-engine-version.sh

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      # Everything below exists so the four engine tests run rather than
      # skip. They are the only check that the server and the engine
      # agree on the JSON the one sends and the other parses.
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Build voacapl and its data tree
        run: |
          git clone --quiet https://github.com/jawatson/voacapl.git /tmp/voacapl
          cd /tmp/voacapl

          # git does not record modification times, so a fresh clone can
          # leave `aclocal.m4` looking older than `configure.ac`. make then
          # tries to run aclocal-1.15 to make it again, which is not
          # installed and is not needed: the generated files are in the
          # repository. Without this the build stops at
          # "aclocal-1.15: command not found", which was proved by
          # building from a fresh clone.
          find . \( -name 'configure.ac' -o -name 'configure.in' \
            -o -name 'Makefile.am' -o -name 'acinclude.m4' \) \
            -exec touch -d '2000-01-01' {} +
          find . \( -name 'aclocal.m4' -o -name 'configure' \
            -o -name 'Makefile.in' -o -name 'config.h.in' \) -exec touch {} +

          ./configure --prefix="$HOME/.local"
          # Serial. `itshfbc/bin/anttyp99` compiles a module that two other
          # files read, and the generated Makefile does not declare that
          # dependency, so a parallel make can start a reader first and
          # fail on a missing `cant99.mod`.
          make
          make install
          # The installed copy: the prefix is substituted into it by the
          # install hook, and the source copy still says __PREFIX__.
          "$HOME/.local/bin/makeitshfbc"

      # The installed binary, not a build tree. `cargo install` writes its
      # own record beside it, so a restored cache makes the step below say
      # "already installed" and do nothing.
      - name: Cache the engine binary
        uses: actions/cache@v6
        with:
          path: /tmp/engine
          key: predict-${{ runner.os }}-${{ steps.engine.outputs.version }}

      - name: Install the engine from crates.io
        run: |
          cargo install hfcast \
            --version "${{ steps.engine.outputs.version }}" \
            --root /tmp/engine --locked
          test -x /tmp/engine/bin/predict

      - name: Test
        env:
          HFCAST_PREDICT: /tmp/engine/bin/predict
        run: |
          pnpm test 2>&1 | tee test.log
          # A skipped engine test means the wiring above silently failed,
          # which would leave the contract unchecked while CI stayed
          # green. Assert zero skips rather than look for a nonzero count,
          # so a change to the reporter's output fails loudly instead of
          # passing quietly.
          if ! grep -qE 'skipped 0$' test.log; then
            echo "::error::tests were skipped, or the summary could not be read"
            exit 1
          fi

  # Nothing in the `check` job installs or builds the app, so for a while
  # nothing checked it at all. A flat-layout setting went dead when pnpm 11
  # stopped reading .npmrc, the next install relinked the tree, and the web
  # build stayed broken until somebody ran it by hand.
  #
  # The install and the export together are what catch that class of fault:
  # the install decides the module layout, and the export is the only step
  # that makes Metro resolve every import and @expo/cli load its own
  # dependencies. A type error alone would not have caught it.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          # The app is a separate project with its own lockfile. Without
          # this the cache keys off the repository root's lockfile, which
          # lists two formatters and none of the app's dependencies.
          cache-dependency-path: mobile/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The script, not a bare `expo export`: it copies canvaskit in
      # first, and the end-to-end tests below run against this export —
      # without those files the map cannot draw.
      - name: Build for web
        run: pnpm web:export

      - name: Check the export produced something
        run: |
          # `expo export` has been known to exit 0 after writing nothing.
          # Assert the two artefacts a served build cannot work without,
          # rather than trusting the exit status alone.
          test -f dist/index.html
          bundle=$(find dist/_expo -name '*.js' -size +100k | head -1)
          if [ -z "$bundle" ]; then
            echo "::error::no JavaScript bundle over 100 kB in dist/_expo"
            exit 1
          fi
          echo "bundled $bundle"

      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # The application driven as a user drives it, against the export
      # checked above and a stubbed prediction server — see
      # `mobile/test/e2e/fixtures.ts`. This is the only check that the
      # screens draw and answer at all.
      - name: End-to-end tests
        run: pnpm test:e2e:only

      # The failure artefacts: a screenshot, the page snapshot and the
      # error context, written only for failed attempts. `always`, not
      # `failure`: a test that fails once and passes on the retry leaves
      # the job green, and the first attempt's picture is exactly the
      # evidence a flake gets chased with. The glob matches only the
      # per-test folders, so a clean run has nothing to upload.
      - name: Keep the failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: mobile/test-results/*/
          if-no-files-found: ignore
