name: Audit

# The hooks run the same checks before a commit and a push, and
# `--no-verify` gets past them, so this is the backstop.
#
# The schedule is the reason this is not only a pull request check: an
# advisory is published against code that has not changed, so a repository
# that is quiet for a month is exactly the one that needs telling.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  # `pnpm audit` covers the three JavaScript packages in the pre-push hook
  # and in CI already. This is the Rust half, which nothing checked.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # The one lockfile this repository holds. The engine is a separate
      # repository and has no dependencies of its own.
      - name: Audit the Rust dependencies
        run: cargo audit --file mobile/modules/engine-bridge/rust/Cargo.lock

  # The Android dependency graph, which is Expo's and React Native's rather
  # than ours: the Kotlin in `mobile/modules/` has no third-party imports.
  #
  # Nothing could scan it before, because `mobile/android/` is generated by
  # `expo prebuild` and is gitignored, so between builds there is no
  # manifest on disk to read. This runs the prebuild first, then hands the
  # resolved graph to GitHub, which turns it into Dependabot alerts.
  #
  # Only from `main`. The graph describes the default branch, and a pull
  # request writing to it would report a branch's dependencies as the
  # repository's.
  gradle:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - working-directory: mobile
        run: pnpm install --frozen-lockfile

      # Resolving dependencies needs the Gradle project, not the native
      # libraries, so this does not build the engine. `--no-install`
      # because pnpm has already done that.
      - name: Generate the Gradle project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: mobile/android
