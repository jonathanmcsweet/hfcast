name: Architectures

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The engine is a separate repository and the app finds it by path. Each
  # job clones it here at the tag of the version in the application's
  # `Cargo.lock`, exactly as the release workflow does.
  ENGINE_REPO: jonathanmcsweet/hfcast-engine

  # The NDK the four libraries are built with. `build-rust.sh` defaults to
  # the same version and fails loudly if it is absent.
  NDK_VERSION: 27.1.12297006

# One job per Android ABI, so a badge that goes red names the ABI that
# broke. What each one builds is the real artefact the APK carries: the
# engine compiled as a shared library through the NDK, not a source-only
# check. Every job writes its own badge whatever happens to it, and the
# last job publishes them to the `badges` branch that the README reads.
jobs:
  abi:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: android-arm64-v8a
            abi: arm64-v8a
            target: aarch64-linux-android
          - slug: android-armeabi-v7a
            abi: armeabi-v7a
            target: armv7-linux-androideabi
          - slug: android-x86-64
            abi: x86_64
            target: x86_64-linux-android
          - slug: android-x86
            abi: x86
            target: i686-linux-android
    steps:
      - uses: actions/checkout@v7

      - name: Read the engine version the application depends on
        id: engine
        run: bash .github/read-engine-version.sh

      - name: Install the NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"

      - run: rustup target add ${{ matrix.target }}

      # The library has the ionospheric coefficients compiled in, and the
      # published crate does not carry them. `build-rust.sh` takes the
      # crate from this checkout instead, at the tag of that version.
      - name: Clone the engine at that version
        run: bash .github/clone-engine.sh "${{ steps.engine.outputs.version }}" /tmp/hfcast-engine

      - name: Cache the engine build
        uses: actions/cache@v6
        with:
          path: mobile/modules/engine-bridge/rust/target
          key: abi-${{ matrix.slug }}-${{ steps.engine.outputs.version }}

      # API 24 is the modern APK's minimum. A library built against a newer
      # API than the app declares fails to load on a device rather than at
      # build time.
      - name: Build the shared library
        working-directory: mobile
        env:
          ANDROID_API: '24'
          HFCAST_ENGINE: /tmp/hfcast-engine
        run: bash modules/engine-bridge/build-rust.sh ${{ matrix.abi }}

      - name: Write the badge
        if: always()
        run: tools/write-badge.sh "android ${{ matrix.abi }}" "${{ job.status }}" "badges/${{ matrix.slug }}.json"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: badge-${{ matrix.slug }}
          path: badges/
          retention-days: 1

  # Only from `main`. A pull request builds every ABI and reports in its
  # own checks, but it must not move the badges the README shows.
  publish-badges:
    needs: abi
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: badges
          pattern: badge-*
          merge-multiple: true

      - run: tools/publish-badges.sh badges
