apply plugin: 'com.android.library'

group = 'com.hfcast.aosplocation'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()

// Only Expo SDK 51 and later define this. Before that the Kotlin plugin above
// set the SDK versions itself, so on SDK 50 — which the Android 5.0 build uses —
// the call is both missing and unnecessary. Asking rather than assuming lets one
// file build under both.
if (project.ext.has('useDefaultAndroidSdkVersions')) {
  useDefaultAndroidSdkVersions()
}

// No dependencies block on purpose. Everything this module calls is in the
// Android platform itself, which is the whole reason it exists: expo-location
// pulls in com.google.android.gms:play-services-location, and that artifact is
// proprietary, so a build containing it cannot ship on F-Droid and does not
// work on a phone without Google services.

android {
  namespace "com.hfcast.aosplocation"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}
