# The one ten inch capture: the forecast in the wide arrangement.
#
# tools/screenshots.sh sets the screen override and forces the rotation
# before this runs, and puts both back after.
appId: solutions.cloudburner.hfcast
---
- launchApp

- tapOn: 'Settings'
- tapOn: 'Dark'
- extendedWaitUntil:
    visible: 'Coverage map.*'
    timeout: 60000

# The wide arrangement is the whole reason for this capture, so stop
# rather than take a stacked one. Past 900 points across, the band grid
# moves to the right of the map card; below that it sits under the map and
# off the bottom of the screen, where this heading is not visible.
- assertVisible: 'All bands, every direction'
- takeScreenshot: 01-forecast-dark
