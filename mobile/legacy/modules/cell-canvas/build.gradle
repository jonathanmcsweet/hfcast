// The Android 5.0 build of modules/cell-canvas. See the note in
// legacy/modules/engine-bridge/build.gradle for why this file exists.
apply plugin: 'com.android.library'

group = 'com.hfcast.cellcanvas'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()

// No dependencies block. Everything drawn here is Android's own Canvas, so
// this file differs from the SDK 57 one only in how the Expo plugin is
// applied.

android {
  namespace "com.hfcast.cellcanvas"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}
