# Four builds per release, so a tag does not describe one build.
AutoUpdateMode: None
UpdateCheckMode: Tags

# The highest code in the release. Every device sees the APKs it can run and
# takes the highest of those, so an arm64 phone gets arm64-v8a rather than
# the armeabi-v7a build it could also install.
CurrentVersion: 1.8.3
CurrentVersionCode: 10080314
