# Goes in fdroiddata as `metadata/io.github.jonathanmcsweet.hfcast.yml`, not in
# this repository. Kept here so it moves with the build it describes, and
# `tools/check-fdroid-pin.sh` fails a push when it stops matching.
#
# Android 7.0 and later only. The Android 5.0 build in `mobile/legacy/` goes
# to GitHub releases and is not offered here, because it has not been tested
# on a device.
#
# Built with `fdroid build --test` on 2026-08-22, at 1.7.0: the scan passes
# with no errors and the APK carries the engine, no Skia, and no signature.
# Two things a local run cannot check, both in docs/fdroid.md: the `sudo:`
# block, which only runs under `--server`, and F-Droid's own gradle wrapper.

Categories:
  - Science & Education
License: Apache-2.0
SourceCode: https://github.com/jonathanmcsweet/hfcast
IssueTracker: https://github.com/jonathanmcsweet/hfcast/issues
Changelog: https://github.com/jonathanmcsweet/hfcast/releases

RepoType: git
Repo: https://github.com/jonathanmcsweet/hfcast.git

# One entry per architecture. `withAbiSplits.ts` gives each APK its own
# version code, `variant.versionCode * 10 + abiCode`, with the ABI digits
# fixed at armeabi-v7a 1, x86 2, arm64-v8a 3, x86_64 4. Those must never be
# renumbered: a device that installed arm64-v8a as 3 has to keep seeing 3.
#
# `subdir` is `mobile` and not `mobile/android`, because prebuild runs in
# subdir and `android/` does not exist until `expo prebuild` makes it.
#
# Node comes from nodejs.org with its checksum rather than from a package
# repository, which is what F-Droid's React Native guide asks for. Debian's
# own Node is too old for Expo SDK 57.
Builds:
  - versionName: 1.8.3
    versionCode: 10080311
    commit: v1.8.3
    subdir: mobile
    sudo:
      - apt-get update
      - apt-get install -y curl rustup xz-utils
      - curl -Lo node.tar.xz https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz
      - echo "14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647 node.tar.xz" | sha256sum -c -
      - tar xf node.tar.xz --strip-components=1 -C /usr/local
      - rm node.tar.xz
      - corepack enable
    init:
      - rustup target add armv7-linux-androideabi
    srclibs:
      - hfcast-engine@v2.14.0
    prebuild:
      - pnpm install --frozen-lockfile
      - node ../tools/expo-build-from-source.mjs package.json
      - bash ../tools/fdroid-prune.sh
      - npx expo prebuild --platform android --no-install
    build:
      - HFCAST_ENGINE=$$hfcast-engine$$ modules/engine-bridge/build-rust.sh armeabi-v7a
      - cd android && gradle assembleRelease -PreactNativeArchitectures=armeabi-v7a -PHFCAST_UNSIGNED=true
    output: android/app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    ndk: 27.1.12297006
    # Everything the scanner rejects that this build does not read is deleted
    # in prebuild by tools/fdroid-prune.sh: prebuilt Skia, Expo's precompiled
    # modules, and the gradle wrappers other packages ship. What is left is
    # six gradle files naming a maven repository React Native has not
    # published to since it moved to Maven Central. Those cannot be deleted,
    # because scandelete removes the whole file for any problem and these are
    # build files the gradle configuration needs.
    #
    # `build-rust.sh` is in `build` rather than prebuild for a related
    # reason: run earlier, its Rust object files and the engine library land
    # before the scan and every one of them is a binary it refuses.
    scanignore:
      - mobile/node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - mobile/node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - mobile/node_modules/react-native-safe-area-context/android/build.gradle
      - mobile/node_modules/react-native-svg/android/build.gradle
      - mobile/node_modules/react-native-vector-icons/android/build.gradle
      - mobile/node_modules/react-native/ReactAndroid/publish.gradle
      - mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc

  - versionName: 1.8.3
