// This is the Expo SDK 57 build of this module. The Android 5.0 build runs on
// SDK 50 and cannot read this file; it gets `legacy/engine-bridge.build.gradle`
// instead, copied in by tools/build-android.sh.
//
// `expo-module-gradle-plugin` is what every module inside Expo itself uses, and
// from SDK 57 it is the only supported way to build one. It brings in the pika
// compiler plugin, which writes each function's argument and result types at
// compile time. Without pika the module still compiles, but every type is left
// as a placeholder that throws the moment the module is created — which stops
// React Native before it draws anything, so the application opens to a black
// screen with one line in the log. The older `applyKotlinExpoModulesCorePlugin`
// used here before does not apply pika.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.hfcast.engine'
version = '1.0.0'

// The prediction engine itself is the Rust in rust/, built by
// ../build-rust.sh into src/main/jniLibs. Gradle packages whatever is there;
// it does not build it, because a Cargo build inside a Gradle task hides
// which of the two failed.
android {
  namespace "com.hfcast.engine"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  sourceSets {
    main {
      jniLibs.srcDirs = ['src/main/jniLibs']
    }
  }
}
