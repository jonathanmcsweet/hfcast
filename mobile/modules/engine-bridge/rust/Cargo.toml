[package]
name = "hfcast-jni"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
# One shared library per Android ABI, loaded by System.loadLibrary.
crate-type = ["cdylib"]

[dependencies]
# The engine, from crates.io. `Cargo.lock` holds the one version cargo
# resolved from the range below, with its checksum, and that version is
# the pin: the CI workflow installs it from crates.io for the server
# tests, and an Android build takes the engine repository at the tag of
# the same version. Nothing here names an engine commit.
#
# Move it with `cargo update -p hfcast --precise <version>`.
#
# `embedded-coefficients` is not on by default in the engine, because the
# published crate does not carry those files. A telephone has no `itshfbc`
# tree to read them from, so this build compiles them in: 544 KB, of which
# 195 KB is NTIA/ITS work and the rest is CCIR Report 322 and 340 data that
# the ITU publishes itself for implementers. The URSI-88 maps are not
# included and cannot be. See the engine's NOTICE and docs/licence.md.
#
# Because those files are only in the engine repository, an Android build
# takes the crate from a checkout of it instead. `build-rust.sh` finds the
# checkout and applies a Cargo path override, which changes where the
# crate comes from and nothing else.

hfcast = { version = "2.14.0", features = ["embedded-coefficients"] }
jni = "0.21"

[profile.release]
# The engine is nearly the whole cost of a map, so it gets the unrolling.
# Measured on the world grid: 1051 ms at 2, 955 ms at 3, for 55 KB more
# library (2026-08-22). The engine's own release profile is 3 as well,
# which is the build its parity evidence comes from.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
